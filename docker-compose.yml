services:
  app:
    build:
      context: .
      dockerfile: src/DotMarc/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DotMarc: "Host=postgres;Database=dotmarc;Username=dotmarc;Password=${POSTGRES_PASSWORD:-dotmarc}"
      Graph__ClientId: ${GRAPH_CLIENT_ID:?Set GRAPH_CLIENT_ID}
      Graph__TenantId: ${GRAPH_TENANT_ID:?Set GRAPH_TENANT_ID}
      Graph__ClientSecret: ${GRAPH_CLIENT_SECRET:?Set GRAPH_CLIENT_SECRET}
      Graph__MailboxAddress: ${GRAPH_MAILBOX_ADDRESS:?Set GRAPH_MAILBOX_ADDRESS}
      Graph__TlsrptMailboxAddress: ${GRAPH_TLSRPT_MAILBOX_ADDRESS:-}
      EntraId__TenantId: ${ENTRAID_TENANT_ID:?Set ENTRAID_TENANT_ID}
      EntraId__ClientId: ${ENTRAID_CLIENT_ID:?Set ENTRAID_CLIENT_ID}
      EntraId__ClientSecret: ${ENTRAID_CLIENT_SECRET:?Set ENTRAID_CLIENT_SECRET}
      InitialAdmins__Emails: ${INITIAL_ADMIN_EMAILS:-}
      MtaSts__HostingHostname: ${MTA_STS_HOSTING_HOSTNAME:-}
      CloudflareDns__ClientId: ${CLOUDFLARE_DNS_CLIENT_ID:-}
      CloudflareDns__ClientSecret: ${CLOUDFLARE_DNS_CLIENT_SECRET:-}
      AzureDns__TenantId: ${AZURE_DNS_TENANT_ID:-}
      AzureDns__ClientId: ${AZURE_DNS_CLIENT_ID:-}
      AzureDns__ClientSecret: ${AZURE_DNS_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

  # Only needed for MTA-STS policy hosting (see getting-started.mdx) — not started by a plain
  # `docker compose up`. Bring it up explicitly with `docker compose --profile mta-sts up`, and
  # only after reading that doc's guidance on port 443/80 conflicts if this host already runs a
  # reverse proxy for anything else.
  caddy:
    image: caddy:2-alpine
    profiles: ["mta-sts"]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dotmarc
      POSTGRES_USER: dotmarc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dotmarc}
    volumes:
      - dotmarc-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotmarc -d dotmarc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dotmarc-postgres-data:
  caddy-data:
