# .github/workflows/pr-source.yml
name: PR source

# Pull requests into main may only come from this repository, and from develop with two exceptions. A fix/* branch is a fix to
# the released product, branched from main, so it can go out without waiting for unreleased code on develop. A docs/* branch is
# the same for the docs, provided every file it changes is under website/. GitHub's branch protection can't restrict a PR's
# source branch, so this check does it and main requires it before merging. The check keeps the name "from-develop" because
# main's protection refers to it by that name.
on:
  pull_request:
    branches: [main]
    # "edited" is what GitHub sends when a PR's base branch is changed, so a PR opened against another branch and then retargeted
    # to main still gets the check. The other three are the defaults.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  from-develop:
    name: from-develop
    runs-on: ubuntu-latest
    steps:
      - name: Require develop, a fix/* branch, or a docs-only docs/* branch, as the source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GH_TOKEN: ${{ github.token }}
          PR_FILES_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          set -euo pipefail

          # head_ref is only a branch name, so a fork's branch called develop would otherwise pass. A deleted fork has no name.
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main must come from a branch in this repository, not a fork (this one is from '${HEAD_REPO:-an unknown repository}')."
            exit 1
          fi

          if [ "$HEAD_REF" = "develop" ]; then
            exit 0
          fi

          case "$HEAD_REF" in
            fix/*)
              echo "A fix branch: allowed into main without going through develop."
              exit 0
              ;;
            docs/*)
              # Not piped into grep, so a failed API call fails the step rather than looking like a docs-only change.
              files="$(gh api --paginate "$PR_FILES_URL" --jq '.[] | .filename, (.previous_filename // empty)')"
              outside="$(printf '%s\n' "$files" | grep -v '^website/' | grep -v '^$' || true)"
              if [ -z "$outside" ]; then
                echo "A docs-only branch: every changed file is under website/."
                exit 0
              fi
              echo "::error::A docs/* branch may only change files under website/. These are outside it:"
              echo "$outside"
              exit 1
              ;;
          esac

          echo "::error::Pull requests into main must come from develop, from a fix/* branch, or from a docs/* branch that only changes website/ (this one is from '$HEAD_REF')."
          exit 1
