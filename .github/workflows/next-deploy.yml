# .github/workflows/next-deploy.yml
name: Deploy next

# Runs on a push to develop and calls CI itself, rather than waiting on a workflow_run of CI: GitHub only fires
# workflow_run triggers from workflow files on the default branch, and this file lives on develop.
on:
  push:
    branches: [develop]
    paths-ignore: [website/**]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DEPLOY_PATH: /opt/dotmarc-next
  DOCKERHUB_IMAGE: homotechsual/dotmarc

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute Docker Hub image name
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One multi-arch build, pushed to GHCR (the server pulls from here) and, when credentials exist, Docker Hub. DEV_BUILD
      # bakes DevBuild__Enabled=true into the image, so anyone running :next gets the dev banner without setting anything.
      - name: Build and push next image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/DotMarc/Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64
          build-args: DEV_BUILD=true
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:next
            ${{ steps.image.outputs.name }}:next-${{ github.sha }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('{0}:next', env.DOCKERHUB_IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DOTMARC_IMAGE: ${{ needs.build-and-push.outputs.image }}:next
      POSTGRES_PASSWORD: ${{ secrets.DOTMARC_DEMO_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOTMARC_DEMO_DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "${{ secrets.DOTMARC_DEMO_DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy stack file to server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DOTMARC_DEMO_DEPLOY_USER }}@${{ secrets.DOTMARC_DEMO_DEPLOY_HOST }} \
            "mkdir -p ${{ env.DEPLOY_PATH }}"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.next.yml \
            ${{ secrets.DOTMARC_DEMO_DEPLOY_USER }}@${{ secrets.DOTMARC_DEMO_DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Write .env on server
        run: |
          {
            echo "DOTMARC_IMAGE=$DOTMARC_IMAGE"
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
          } | base64 -w0 | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DOTMARC_DEMO_DEPLOY_USER }}@${{ secrets.DOTMARC_DEMO_DEPLOY_HOST }} \
            'base64 -d > ${{ env.DEPLOY_PATH }}/.env && chmod 600 ${{ env.DEPLOY_PATH }}/.env'

      - name: Roll out stack
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DOTMARC_DEMO_DEPLOY_USER }}@${{ secrets.DOTMARC_DEMO_DEPLOY_HOST }} \
            "cd ${{ env.DEPLOY_PATH }} && \
             docker compose -f docker-compose.next.yml --env-file .env pull && \
             docker compose -f docker-compose.next.yml --env-file .env up -d && \
             docker image prune -f"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
