name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: homotechsual/dotmarc

jobs:
  # A commit that carries a v*.*.* tag is built and published by the Release workflow, which also sets `edge`,
  # so building it again here would only repeat the same work.
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.tag.outputs.release }}
    steps:
      - name: Check whether this commit is a tagged release
        id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail

          if [ "$MANUAL" = "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ls-remote lists each annotated tag twice: the tag object, and the commit it points at (the ^{} line).
          # Matching the commit sha against the start of any line therefore finds both kinds of tag.
          TAGS="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v*')"
          if grep -q "^$SHA" <<< "$TAGS"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$SHA is a tagged release; the Release workflow publishes it."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: check
    if: ${{ needs.check.outputs.release != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Compute Docker Hub image name
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "name=${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/DotMarc/Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        if: ${{ steps.dockerhub.outputs.enabled == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/DotMarc/Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.name }}:edge
            ${{ steps.dockerhub.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
