name: CI

on:
  push:
    branches: [main]
    # Only image/build/deployment inputs should start the CI -> Publish -> demo chain.
    paths:
      - "src/**"
      - "test/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - "nuget.config"
      - "dotMARC.sln"
      - ".dockerignore"
      - "docker-compose.demo.yml"
      - "scripts/deployment-url.sh"
      - "scripts/verify-deployment.sh"
      - "scripts/ci-scope.mjs"
      - "scripts/ci-scope.test.mjs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/demo-deploy.yml"
  # No paths filter on pull requests: main requires the "test" check, and a workflow skipped by a path filter never
  # reports it, which would block a docs-only PR for good. Instead the job always runs and skips its steps when the PR
  # changes no application/build inputs. Keep push.paths aligned with scripts/ci-scope.mjs.
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI scope detection
        run: node --test scripts/ci-scope.test.mjs

      - name: Check whether the change needs the test suite
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-scope.mjs

      - name: Test the release scripts
        run: node --test scripts/release-tags.test.mjs

      - name: Set up .NET
        if: steps.scope.outputs.needed == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        if: steps.scope.outputs.needed == 'true'
        run: dotnet restore dotMARC.sln

      - name: Build solution
        if: steps.scope.outputs.needed == 'true'
        run: dotnet build dotMARC.sln -c Release --no-restore

      - name: Run tests
        if: steps.scope.outputs.needed == 'true'
        run: dotnet test dotMARC.sln -c Release --no-build
