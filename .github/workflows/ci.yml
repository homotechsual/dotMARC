name: CI

on:
  # A push to main runs CI, and CI finishing is what builds the :edge image and redeploys the demo, so only what changes the image,
  # the demo's deployment or these workflows should start it. The website has its own workflows, and the docs, the release scripts
  # and the other workflows don't change what runs. This filter applies to pushes only: the pull_request trigger below has none,
  # because main requires the test check on every pull request.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Directory.Packages.props"
      - "global.json"
      - "nuget.config"
      - "dotMARC.sln"
      - ".dockerignore"
      - "docker-compose.demo.yml"
      - "scripts/deployment-url.sh"
      - "scripts/verify-deployment.sh"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - ".github/workflows/demo-deploy.yml"
  # No paths filter on pull requests: main requires the "test" check, and a workflow skipped by a path filter never
  # reports it, which would block a docs-only PR for good. Instead the job always runs and skips its steps when the PR
  # changes nothing outside website/.
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the change needs the test suite
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] \
            && ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qv '^website/'; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Only website/ changed, so the .NET build and tests are skipped (the website has its own CI)."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the release scripts
        if: steps.scope.outputs.needed == 'true'
        run: node --test scripts/release-tags.test.mjs

      - name: Set up .NET
        if: steps.scope.outputs.needed == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        if: steps.scope.outputs.needed == 'true'
        run: dotnet restore dotMARC.sln

      - name: Build solution
        if: steps.scope.outputs.needed == 'true'
        run: dotnet build dotMARC.sln -c Release --no-restore

      - name: Run tests
        if: steps.scope.outputs.needed == 'true'
        run: dotnet test dotMARC.sln -c Release --no-build
