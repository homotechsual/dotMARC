question: Can I stop certain alerts, or certain clients, from creating PSA tickets?
answer: |
  Yes. On **Alert settings**, the **Which alerts create tickets** panel has a switch for each alert type, and applies
  to every PSA when the alert rule follows ticket rules. The alert is still recorded and notification delivery
  still follows its destinations and quiet hours.

  For one client, open **Manage groups** and use **Ticket rules** on that client's group. Each alert type can
  follow the default, always create tickets, or never create them. The button appears once the group is linked to
  a company in one of your PSAs.

  The alert rule's **Ticket mode** takes precedence: **Never open a ticket** suppresses tickets regardless
  of group/global switches, and **Always open a ticket** overrides those switches but still needs a ready
  PSA connection and a company mapping. **Follow the ticket rules** uses the deciding group's override,
  then the global switch, then the alert type's default. A direct domain company mapping uses global rules
  rather than group overrides. Existing-open-ticket suppression still applies.

  Changes affect newly raised alerts, not tickets already open.

  See [PSA integration: Choose which alerts create tickets](/docs/psa-integration#choose-which-alerts-create-tickets)
  for the details, including how domains in several groups are handled.
