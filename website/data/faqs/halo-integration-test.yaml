question: How do I check the HaloPSA integration actually works?
answer: |
  Use **Test the integration** on the Alert settings page, under the PSA settings. It creates a clearly
  marked test ticket from your most recent alert's details, closes it using your closed status, and then
  waits for Halo to call the webhook back, showing each step as it goes. If a step fails, the message
  says what Halo answered or what to check, for example a wrong webhook secret or a status that doesn't
  match your closed status.

  It uses the settings you have **saved**, so save first. It leaves one closed `[dotMARC test]` ticket in
  Halo and doesn't touch any real alert.

  If the close step says Halo needs the ticket assigned first, set **Assign new tickets to** (or make
  Halo assign new tickets itself). Halo won't close a ticket nobody is assigned to.

  See [PSA integration: Test the whole integration](/docs/psa-integration#test-the-whole-integration)
  for the full walkthrough.
