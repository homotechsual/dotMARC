question: Can dotMARC alert on a low DMARC pass rate or a sudden change in mail volume?
answer: |
  Yes. **DMARC pass rate low**, **Message volume changed** and **Rejected or quarantined messages
  high** each have a default rule under **Manage > Alerts & PSA > Rules**, but all three ship switched off.
  Enable the ones you need and choose their thresholds, lookback windows and domain scope.

  The checks count messages, not report files. Pass-rate and volume rules have minimum-volume
  settings to avoid noise on quiet domains; volume compares two equal periods. A domain with no
  reports doesn't trigger these metrics: use the missing-report rule for that case.

  These alert types don't create tickets by default. Choose ticket behaviour separately, and
  remember that enabling a metric doesn't make receiver reports arrive sooner.

  See [Metric alerts](/docs/alerts#metric-alerts) for ranges and defaults.
