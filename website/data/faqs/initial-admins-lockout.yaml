question: I deployed dotMARC and now no one can sign in - how do I get Admin access back?
answer: |
  Authorization in dotMARC is deny-by-default: with no existing access grants, every user is
  locked out, including whoever deployed it. On each startup, dotMARC checks whether the `UserAccess`
  table is empty. If it is, the comma-separated emails in `InitialAdmins__Emails` receive the Admin role.

  If you deployed without setting it and there are still no access grants, set `InitialAdmins__Emails`
  to your sign-in email and restart the app. You don't need to insert a database row in that case.

  If any access grants already exist, the setting does not add or replace them. Ask an existing
  administrator to restore your access. If no administrator can sign in, recovery needs direct
  database access; changing this environment variable alone won't fix it.

  Set `InitialAdmins__Emails` **before** your first deploy (or before deploying the permissions
  feature to an existing environment) to avoid this entirely. See
  [Getting Started: Configure](/docs/getting-started#configure) for where it's set, and
  [Permissions & Access](/docs/permissions-and-access#bootstrapping-the-first-admin) for how
  bootstrapping works.
category: Entra & authentication
order: 2
