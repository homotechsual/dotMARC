question: Does dotMARC page me the moment something breaks?
answer: |
  No, by design. dotMARC is a dashboard you check and an alert feed you get notified through, not
  a paging system - there's no push notification or real-time delivery path.

  Detection depends on the alert. **Missing DMARC report** uses the rule's **Days without a report**
  (default 2), checked on the **Monitor interval** (default 300 seconds). **TLS delivery failures**
  depends on a failed-session TLSRPT report arriving and being polled. DNS checks have their own
  refresh cycle. DMARC aggregate reports are typically daily, so faster polling can't reveal mail
  that receivers haven't reported yet.

  Thresholds, scope and optional cooldown overrides live under **Manage > Alerts & PSA > Rules**. Delivery goes
  to the rule's destinations, and quiet hours can hold or mute that notification without hiding the
  alert or preventing an otherwise eligible PSA ticket. Critical alerts bypass quiet hours by default,
  unless you change that on the rule. A delayed notification doesn't necessarily mean detection failed.

  See [Alerts](/docs/alerts#alert-settings) for all the delivery and timing settings, and
  [Alert rules](/docs/alert-rules) for rule-specific behaviour.
