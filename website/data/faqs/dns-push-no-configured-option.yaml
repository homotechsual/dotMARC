question: The DNS push button says it "couldn't find a configured push option" - what does that mean?
answer: |
  This message covers three different situations, and it's worth telling them apart before you go
  looking for a bug:

  - **The domain's DNS provider wasn't recognized.** dotMARC couldn't identify it from the domain's
    nameservers, so you'll need to add the record manually.
  - **The provider was recognized but has no push integration.** dotMARC recognises providers such as
    GoDaddy, Route 53 and Namecheap, but automated push is supported only for Cloudflare, Azure DNS
    and Google Cloud DNS. Detecting a provider doesn't mean dotMARC can write to it.
  - **The provider was recognized, but isn't configured on this deployment.** The push action
    can still appear when that provider's OAuth client settings haven't been saved under
    **Manage > DNS push settings**. Check configuration before trying again.

  Either way, the manual DNS instructions shown alongside the push button always work as a
  fallback. See [DNS Provider Push](/docs/dns-provider-push) for how to configure each provider.
category: DNS provider push
order: 1
